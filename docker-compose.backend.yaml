version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: capella-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - TABBY_ENABLED=${TABBY_ENABLED:-true}
      - TAMARA_ENABLED=${TAMARA_ENABLED:-true}
      - ZIINA_API_KEY=${ZIINA_API_KEY}
      - ZIINA_WEBHOOK_SECRET=${ZIINA_WEBHOOK_SECRET}
      - ZIINA_WEBHOOK_URL=${ZIINA_WEBHOOK_URL}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN}
      - MAILTRAP_SENDER_EMAIL=${MAILTRAP_SENDER_EMAIL:-hello@capellauae.com}
      - MAILTRAP_SENDER_NAME=${MAILTRAP_SENDER_NAME:-Capella}
      - MAILTRAP_OWNERS=${MAILTRAP_OWNERS}
      - META_PIXEL_ID=${META_PIXEL_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_TEST_EVENT_CODE=${META_TEST_EVENT_CODE:-}
    networks:
      - coolify-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun --eval "fetch(''http://localhost:3001/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    container_name: capella-cms
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coolify-network

networks:
  coolify-network:
    external: true
    name: ${COOLIFY_DB_NETWORK:-coolify}
