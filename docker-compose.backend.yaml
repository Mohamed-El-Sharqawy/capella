version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: capella-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    networks:
      - app-network
      - coolify-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.capella-backend.loadbalancer.server.port=3001"
      - "traefik.docker.network=coolify"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun --eval "fetch(''http://localhost:3001/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    container_name: capella-cms
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    links:
      - "backend:capella-internal-api"
    networks:
      - app-network
      - coolify-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.capella-cms.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"

networks:
  app-network:
    driver: bridge
  coolify-network:
    external: true
    name: ${COOLIFY_DB_NETWORK:-coolify}
