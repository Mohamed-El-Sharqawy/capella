version: "3.8"

services:
  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: capella-marketing
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - PORT=4000
    networks:
      - coolify-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.capella-marketing.loadbalancer.server.port=4000"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  coolify-network:
    external: true
    name: ${COOLIFY_DB_NETWORK:-coolify}
